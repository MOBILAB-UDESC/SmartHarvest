sh_bt_core:
  ros__parameters:
    tree_xml_path: ""
    enable_groot: true
    wait_for_msg_timeout: 0.2
    sync_timeout: 0.25
    wait_for_service_timeout: 5.0
    service_response_timeout_: 2.0
    wait_for_action_timeout: 0.5
    auto_mode: false
    camera_default_topics: #
      - camera_0/rgb/image
      - camera_0/depth/image
      - camera_0/rgb/camera_info
    detection_service_name: get_detections
    # bt_plugin_ids: []

sh_detection_server:
  ros__parameters:
    model_path: model/apple_mobi.pt # absolute or package-relative path
    # model_path: model/best.pt # absolute or package-relative path
    input_size: [1280, 1280]
    detection_service_name: get_detections
    use_gpu: true
    min_inference_confidence: 0.50
    inference_iou_threshold: 0.70
    inference_max_objects: 10
    visualize_rgb: false
    visualize_depth: false
    publish_detections_image: true

sh_planning_scene_server:
  ros__parameters:
    clear_scene_service_name: clear_scene
    update_scene_service_name: update_from_pose_scene
    ground_plane_link: base_link
    ground_plane_dimension: [1.0, 1.0, 0.001]
    ground_plane_position: [0.0, 0.0, -0.066]
    target_shape: SPHERE # SPHERE (radius), BOX (x,y,z), CONE (radius, height), CYLINDER (radius, height)
    target_dimension: [0.03]