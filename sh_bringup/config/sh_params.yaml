sh_bt_core:
  ros__parameters:

    tree_xml_path: ""
    enable_groot: true

    default_sub_timeout: 0.2
    default_sync_timeout: 0.5
    wait_for_service_timeout: 5.0
    default_service_response_timeout: 5.0
    wait_for_action_timeout: 5.0
    default_action_response_timeout: 0.0

    auto_mode: false

    # DEFAULT BT NODES CONFIG
    camera_default_topics:
      - camera_0/rgb/image
      - camera_0/depth/image
      - camera_0/rgb/camera_info
    detection_service_name: run_perception
    camera_to_end_effector_transform: [-1.571, 0.0, -1.571]
    transformation_timeout: 1.0
    clear_scene_service_name: clear_scene
    update_scene_service_name: update_from_pose_scene
    move_to_named_target_action_name: move_to_named_target
    move_to_pose_action_name: move_to_pose
    move_to_object_action_name: move_to_object
    object_name_prefix: Apple

    # bt_plugin_ids: [something_action_node]

yolo_server:
  ros__parameters:
    # model_path: /home/nilton/Downloads/yolo26m.pt
    model_path: "/home/nilton/Desktop/Ros2/smart_harvesting/src/sh_rgbd_perception_pipeline/model/apple_mobi.pt"

sh_perception_server:
  ros__parameters:
    service_name: "run_perception"
    pipeline:
      plugin: "sh_rgbd_perception_pipeline::RgbdPerceptionPipeline"
      detector:
        plugin: "sh_rgbd_perception_pipeline::YoloDetectorPY"
        inference_verbose: false
        use_gpu: true
        min_confidence_threshold: 0.5
        iou_threshold: 0.7
        input_size: [1280, 736]
      localiser:
        plugin: "sh_rgbd_perception_pipeline::MeanLocaliser"
        points: 1
        camera_to_end_effector_transform: [-1.571, 0.0, -1.571]
      grasp:
        plugin: "sh_rgbd_perception_pipeline::BasicGraspGenerator"
        # Custom grasping parameters
        camera_to_end_effector_transform: [-1.571, 0.0, -1.571]
        orientation_euler: [0.0, 0.0, 0.0]

sh_planning_scene_handler:
  ros__parameters:
    clear_scene_service_name: clear_scene
    update_scene_service_name: update_from_pose_scene
    ground_plane_link: base_link
    ground_plane_dimension: [1.0, 1.0, 0.001]
    ground_plane_position: [0.0, 0.0, -0.066]
    target_shape: SPHERE # SPHERE (radius), BOX (x,y,z), CONE (radius, height), CYLINDER (radius, height)
    target_dimension: [0.04]

sh_move_group_server:
  ros__parameters:
    action_names:
      move_to_named_target: move_to_named_target
      move_to_pose: move_to_pose
      move_to_object: move_to_object
    arm_planning_config:
      move_group: arm
      planning_pipeline: ompl # ompl
      planner_id: RRTConnectkConfigDefault # TrajOpt
      planning_time: 10.0
      planning_attempts: 10
      vel_acc_scaling_factors: [0.5, 0.5]
      override: false
      # STOMP:
      #   num_timesteps: "60"
      #   num_iterations: "40"
      #   num_iterations_after_valid: "0"
      #   num_rollouts: "30"
      #   max_rollouts: "30"
      #   exponentiated_cost_sensitivity: "0.5"
      #   control_cost_weight: "0.1"
      #   delta_t: "0.1"
    gripper_planning_config:
      move_group: gripper
      planning_pipeline: stomp # ompl
      planner_id: STOMP # TrajOpt
      planning_time: 2.0
      planning_attempts: 2
      vel_acc_scaling_factors: [0.5, 0.5]
      override: false
      STOMP:
        num_timesteps: "60"
        num_iterations: "40"
        num_iterations_after_valid: "0"
        num_rollouts: "30"
        max_rollouts: "30"
        exponentiated_cost_sensitivity: "0.5"
        control_cost_weight: "0.1"
        delta_t: "0.1"